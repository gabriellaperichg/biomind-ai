<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Entrar — Trichon AI</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/login.js" defer></script>
</head>

<body class="login-page">
  <main class="login-shell">
    <section class="login-brand" aria-labelledby="brand-title">
      <div class="brand-content">
        <img
          class="trichon-logo"
          src="/static/trichon-ai-lockup.svg"
          alt="Trichon AI"
          id="brand-title"
        >
      </div>

      <img
        class="dr-hair-logo"
        src="/static/dr-hair-logo.png"
        alt="Dr. Hair"
      >
    </section>

    <section class="login-panel" aria-label="Acesso ao Trichon AI">
      <div class="login-panel-inner">
        <h1>Log in</h1>

        <div class="login-card">
          <div id="login-view">
            <h2>SDR Desk</h2>
            <p class="form-description">
              Insira suas credenciais para acessar o sistema.
            </p>

            <form id="login-form" novalidate>
              <label class="field">
                <span>E-mail</span>
                <input
                  id="email"
                  name="email"
                  type="email"
                  inputmode="email"
                  autocomplete="username"
                  maxlength="255"
                  required
                  autofocus
                >
              </label>

              <label class="field">
                <span>Senha</span>
                <span class="password-control">
                  <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    maxlength="200"
                    required
                  >
                  <button
                    class="show-password"
                    type="button"
                    data-toggle-password="password"
                    aria-label="Mostrar senha"
                  >
                    Mostrar
                  </button>
                </span>
              </label>

              <div
                class="form-message"
                id="login-message"
                role="alert"
                aria-live="polite"
              ></div>

              <button class="primary-button" id="login-button" type="submit">
                <span class="button-label">Entrar</span>
                <span class="button-loading" hidden>Verificando…</span>
              </button>
            </form>
          </div>

          <div id="change-password-view" hidden>
            <h2>Crie uma nova senha</h2>
            <p class="form-description">
              A senha recebida é temporária. Defina uma nova senha antes de continuar.
            </p>

            <form id="change-password-form" novalidate>
              <label class="field">
                <span>Senha temporária</span>
                <span class="password-control">
                  <input
                    id="current-password"
                    type="password"
                    autocomplete="current-password"
                    maxlength="200"
                    required
                  >
                  <button
                    class="show-password"
                    type="button"
                    data-toggle-password="current-password"
                    aria-label="Mostrar senha temporária"
                  >
                    Mostrar
                  </button>
                </span>
              </label>

              <label class="field">
                <span>Nova senha</span>
                <span class="password-control">
                  <input
                    id="new-password"
                    type="password"
                    autocomplete="new-password"
                    minlength="10"
                    maxlength="200"
                    required
                  >
                  <button
                    class="show-password"
                    type="button"
                    data-toggle-password="new-password"
                    aria-label="Mostrar nova senha"
                  >
                    Mostrar
                  </button>
                </span>
              </label>

              <label class="field">
                <span>Confirme a nova senha</span>
                <span class="password-control">
                  <input
                    id="confirm-password"
                    type="password"
                    autocomplete="new-password"
                    minlength="10"
                    maxlength="200"
                    required
                  >
                  <button
                    class="show-password"
                    type="button"
                    data-toggle-password="confirm-password"
                    aria-label="Mostrar confirmação da senha"
                  >
                    Mostrar
                  </button>
                </span>
              </label>

              <p class="password-hint">
                Use pelo menos 10 caracteres. Uma combinação de palavras é mais fácil de lembrar e mais segura.
              </p>

              <div
                class="form-message"
                id="change-password-message"
                role="alert"
                aria-live="polite"
              ></div>

              <button
                class="primary-button"
                id="change-password-button"
                type="submit"
              >
                <span class="button-label">Alterar senha</span>
                <span class="button-loading" hidden>Alterando…</span>
              </button>
            </form>
          </div>
        </div>
      </div>

      <p class="login-footer">
        Proudly made by Dr. Hair @ 2026
      </p>
    </section>
  </main>
</body>
</html>
